[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderead"
version = "0.1.0"
description = "Debug flow trace tool for source reading"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "code_reading_tools" }
]

[project.scripts]
coderead = "coderead.cli:main"

[dependency-groups]
dev = [
  "debugpy>=1.8",
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
